# CustomMobs 全体設定

# このサーバーの識別子。ペット所有権レコードにどのサーバーで飼われたかを記録するのに使う
server-id: "mc1"

# ペット所有権・経済連携用DB(FJEconomyと同じMariaDBインスタンス・DBに接続する)
database:
  url: "jdbc:mariadb://10.2.1.27:3306/fjeconomy?characterEncoding=utf8mb4&serverTimezone=Asia/Tokyo"
  username: "fje"
  password: "your_password_here"
  pool-size: 5
  max-lifetime: 1800000

pets:
  # 1ブロック設置するごとの待機Tick数(建築アニメーションの速さ)
  build-interval-ticks: 5
