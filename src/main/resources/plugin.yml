name: CustomMobs
version: '${project.version}'
main: com.kaguya.custommobs.CustomMobsPlugin
api-version: '1.20'
author: kaguya-prj

# CoreProtect: ペットの建築ログ記録に使用(未導入でも起動はする)。フォーク(customProtect等)にも
# 対応しているが、名前解決の都合上ここではオリジナルの名前だけ書いておけば読み込み順は保証される。
softdepend: [CoreProtect, customProtect]

commands:
  cmob:
    description: Custom Mob管理コマンド
    usage: /cmob spawn <mobId> [x y z] [world] | /cmob reload | /cmob list | /cmob cleanup [mobId] | /cmob tame | /cmob release | /cmob build <listingId> | /cmob mypets | /cmob claim
    # ここでpermissionを指定すると、custommobs.petしか持たない一般プレイヤーがBukkit側の
    # 事前チェックで弾かれてしまう(サブコマンドごとの権限はCustomMobCommand側で判定している)。

permissions:
  custommobs.command:
    description: /cmob spawn・reload・list・cleanup などサーバー管理者向けサブコマンドを使用できる
    default: op
  custommobs.pet:
    description: /cmob tame・release・build・mypets・claim などペット機能を使用できる
    default: true
  custommobs.pet.admin:
    description: 所有者チェックを無視して他人のペットもrelease/buildできる(サポート対応用)
    default: op
