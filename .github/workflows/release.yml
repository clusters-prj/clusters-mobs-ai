name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve version
        id: version
        run: |
          BASE_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version | sed 's/-SNAPSHOT$//')
          BUILD_NUMBER="${{ github.run_number }}"
          FULL_VERSION="${BASE_VERSION}+build.${BUILD_NUMBER}"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "full_version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set project version
        run: mvn -q versions:set -DnewVersion=${{ steps.version.outputs.full_version }} -DgenerateBackupPoms=false

      - name: Build with Maven
        run: mvn -B -q package

      - name: Locate jar
        id: jar
        run: |
          # finalNameはpom.xmlで${project.artifactId}に固定してあるので、常にこのパスになる。
          # 以前は `find target -name "*.jar" | head -n 1` で拾っていたが、findのディレクトリ
          # 走査順は決定的ではなく、shade前のoriginal-custom-mobs-ai.jar(依存関係なし)を
          # 誤って選んでしまうことがあった(実際に本番で発生: 依存関係を含まないjarが
          # リリースされ、サーバー起動時にMariaDBドライバ等が見つからずロード不能になった)
          JAR_PATH="target/custom-mobs-ai.jar"
          if [ ! -f "$JAR_PATH" ]; then
            echo "::error::期待したjarが見つかりません: $JAR_PATH"
            ls -la target/*.jar
            exit 1
          fi
          echo "jar_path=${JAR_PATH}" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "${JAR_PATH}")" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.full_version }}
          name: Build ${{ steps.version.outputs.build_number }} (v${{ steps.version.outputs.base_version }})
          generate_release_notes: true
          files: ${{ steps.jar.outputs.jar_path }}
